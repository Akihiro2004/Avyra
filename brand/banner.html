<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1600px; height: 900px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      color: #f4f5fb;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(112,87,255,.54), transparent 34%),
        radial-gradient(circle at 90% 86%, rgba(53,226,193,.34), transparent 35%),
        linear-gradient(135deg, #080a12 0%, #101526 52%, #081713 100%);
    }
    .copy { position: absolute; left: 100px; top: 100px; width: 640px; z-index: 3; }
    .brand { display: flex; align-items: center; gap: 26px; }
    .brand img { width: 126px; height: 126px; }
    .brand strong { font-size: 94px; line-height: 1; letter-spacing: -6px; }
    h1 { margin: 72px 0 22px; font-size: 76px; line-height: .98; letter-spacing: -4px; }
    p { margin: 0; max-width: 560px; color: #b9c0d2; font-size: 29px; line-height: 1.38; }
    .tag { display: inline-block; margin-top: 40px; padding: 14px 22px; border-radius: 16px; color: #d9d2ff; background: #2a2055; font-size: 22px; font-weight: 700; letter-spacing: .4px; }
    .phones { position: absolute; right: 68px; bottom: -195px; width: 800px; height: 1060px; }
    .phone { position: absolute; width: 318px; height: 706px; overflow: hidden; border: 8px solid #242b3d; border-radius: 48px; background: #080a12; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
    .phone img { width: 100%; height: 100%; object-fit: cover; }
    .one { left: 10px; top: 190px; transform: rotate(-7deg); }
    .two { left: 265px; top: 58px; z-index: 2; }
    .three { left: 522px; top: 170px; transform: rotate(7deg); }
  </style>
</head>
<body>
  <section class="copy">
    <div class="brand"><img src="../app/src/main/assets/Logo.svg" alt=""><strong>Avyra</strong></div>
    <h1>Your sound,<br>in motion.</h1>
    <p>An artwork-led player with a distinct violet–aqua identity, familiar controls, and room for every detail.</p>
    <span class="tag">AVYRA ORBIT UI</span>
  </section>
  <section class="phones">
    <div class="phone one"><img src="avyra-library.png" alt=""></div>
    <div class="phone two"><img src="avyra-home-clean.png" alt=""></div>
    <div class="phone three"><img src="avyra-settings-current.png" alt=""></div>
  </section>
</body>
</html>
