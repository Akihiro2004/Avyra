name: Bug report
description: Tell us about a problem that can be reproduced.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove cookies, tokens, private URLs, and personal data before submitting.
  - type: input
    id: version
    attributes:
      label: Avyra version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest steps that make the problem happen.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste only the useful part and remove private values.
  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed credentials and personal data.
          required: true
