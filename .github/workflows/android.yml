name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;27.0.12077973

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run unit tests and build development APK
        run: ./gradlew --no-daemon testProdReleaseUnitTest assembleDevDebug
