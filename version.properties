# The one place Avyra's version is set.
#
# Read by app/build.gradle.kts and compiled into BuildConfig, so this file is
# the only edit a release needs. Nothing else in the tree hardcodes a version:
# the Settings footer, the "Check for Updates" row and the update checker's
# comparison against a GitHub tag all read BuildConfig.VERSION_NAME.
#
# ── versionName ──────────────────────────────────────────────────────────
# What people see, and what the updater compares against a release tag.
# A GitHub tag of "v1.0.1" or "1.0.1" is read as newer than 1.0.0; the "v"
# is stripped and the parts are compared numerically, so 1.0.10 > 1.0.9.
#
# ── versionCode ──────────────────────────────────────────────────────────
# Android's own counter, never shown to anyone. It MUST only ever increase:
# the package manager refuses to install a lower code over a higher one, so
# lowering it strands every existing install on the build it already has —
# they would have to uninstall first, losing downloads, queue and settings.
#
# This is why the code below is 11 rather than 1 while the name resets to
# 1.0.0. The two are independent, and only the name is cosmetic. Bump the
# code by one for every release you publish, whatever the name says.
versionName=1.0.0
versionCode=11
